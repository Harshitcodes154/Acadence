<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="228" viewBox="0 0 1200 228" role="img" aria-labelledby="title desc"><title id="title">From setup to a shareable academic plan</title><desc id="desc">From setup to a shareable academic plan</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="228" rx="22" fill="#f6f5fb" /><rect x="22" y="22" width="268" height="182" rx="16" fill="#ffffff" stroke="#e5e1ef"/><rect x="42" y="42" width="38" height="32" rx="9" fill="#7660cf" /><text x="52" y="64" font-size="12" fill="white" font-weight="700" >01</text><text x="42" y="110" font-size="23" fill="#272237" font-weight="700" >Configure</text><text x="42" y="146" font-size="13" fill="#777182" font-weight="400" >Departments, rooms, batches</text><text x="42" y="167" font-size="13" fill="#777182" font-weight="400" >and the subjects that matter.</text><path d="M296 108h14m-5-5 5 5-5 5" stroke="#9c8ec1" stroke-width="2" fill="none"/><rect x="318" y="22" width="268" height="182" rx="16" fill="#ffffff" stroke="#e5e1ef"/><rect x="338" y="42" width="38" height="32" rx="9" fill="#eeeafa" /><text x="348" y="64" font-size="12" fill="#7660cf" font-weight="700" >02</text><text x="338" y="110" font-size="23" fill="#272237" font-weight="700" >Generate</text><text x="338" y="146" font-size="13" fill="#777182" font-weight="400" >A balanced five-day timetable</text><text x="338" y="167" font-size="13" fill="#777182" font-weight="400" >with a room for every batch.</text><path d="M592 108h14m-5-5 5 5-5 5" stroke="#9c8ec1" stroke-width="2" fill="none"/><rect x="614" y="22" width="268" height="182" rx="16" fill="#ffffff" stroke="#e5e1ef"/><rect x="634" y="42" width="38" height="32" rx="9" fill="#eeeafa" /><text x="644" y="64" font-size="12" fill="#7660cf" font-weight="700" >03</text><text x="634" y="110" font-size="23" fill="#272237" font-weight="700" >Review</text><text x="634" y="146" font-size="13" fill="#777182" font-weight="400" >Approve a draft or leave</text><text x="634" y="167" font-size="13" fill="#777182" font-weight="400" >a clear note for revision.</text><path d="M888 108h14m-5-5 5 5-5 5" stroke="#9c8ec1" stroke-width="2" fill="none"/><rect x="910" y="22" width="268" height="182" rx="16" fill="#ffffff" stroke="#e5e1ef"/><rect x="930" y="42" width="38" height="32" rx="9" fill="#eeeafa" /><text x="940" y="64" font-size="12" fill="#7660cf" font-weight="700" >04</text><text x="930" y="110" font-size="23" fill="#272237" font-weight="700" >Export</text><text x="930" y="146" font-size="13" fill="#777182" font-weight="400" >Download every batch as CSV</text><text x="930" y="167" font-size="13" fill="#777182" font-weight="400" >or print the selected batch.</text></g></svg>
